name: Собрать и опубликовать сайт

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Тесты гоняем до сборки: сломанная база или расчёт не должны уйти на Pages.
      - name: Тесты
        run: |
          node tests/smoke.test.mjs
          node tests/parser.test.mjs
          node tests/relationships.test.mjs

      # Даёт base_url проекта (например, https://majanames.github.io/Infusion).
      - id: pages
        uses: actions/configure-pages@v5

      - run: node tools/build-pages.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
