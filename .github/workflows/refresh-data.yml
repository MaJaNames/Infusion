name: Обновить снимок базы

on:
  schedule: [{ cron: '0 21 * * *' }]    # 21:00 UTC соответствует 04:00 UTC+11
  workflow_dispatch:                    # и вручную: вкладка Actions → Run workflow

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node tools/export-data.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --cached --quiet || (git commit -m "Обновлён снимок базы" && git push)
